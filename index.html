<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Indus Wok POS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{--primary:#c0392b;--primary-dark:#962d22;--dark:#1a1a2e;--dark2:#16213e;--card:#1e2a4a;--accent:#0f3460;--green:#27ae60;--orange:#f39c12;--blue:#3498db;--purple:#8e44ad;--text:#e8e8e8;--text-dim:#8892b0;--radius:12px}
body{background:var(--dark);color:var(--text);overflow:hidden;height:100vh}
#app{height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,var(--dark),var(--dark2))}
.login-box{background:var(--card);padding:40px;border-radius:20px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-box h1{color:var(--primary);font-size:24px;margin-bottom:4px}
.login-box p{color:var(--text-dim);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:14px;margin-bottom:12px;border:1px solid #334;border-radius:10px;background:#0d1b2a;color:#fff;font-size:16px}
.login-box input:focus{outline:none;border-color:var(--primary)}
.role-pills{display:flex;gap:6px;margin-bottom:12px}
.role-pill{flex:1;padding:8px;border-radius:8px;background:#0d1b2a;border:1px solid #334;cursor:pointer;font-size:12px;color:var(--text-dim)}
.role-pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.pin-btn{padding:18px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:22px;font-weight:700;cursor:pointer;transition:.15s}
.pin-btn:hover{background:var(--primary)}
.pin-btn:active{transform:scale(.95)}
.pin-display{text-align:center;font-size:28px;letter-spacing:12px;margin:12px 0;color:var(--primary)}

/* LAYOUT */
#mainApp{display:flex;height:100vh}
.sidebar{width:70px;background:var(--dark2);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;flex-shrink:0;overflow-y:auto}
.sidebar .logo{width:44px;height:44px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px}
.nav-btn{width:50px;height:50px;border:none;border-radius:12px;background:transparent;color:var(--text-dim);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;position:relative}
.nav-btn:hover{background:var(--card);color:#fff}
.nav-btn.active{background:var(--primary);color:#fff}
.nav-btn .badge{position:absolute;top:2px;right:2px;background:var(--orange);color:#fff;font-size:10px;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-weight:700}
.content{flex:1;overflow-y:auto;padding:16px 20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.topbar h2{font-size:20px}
.topbar .actions{display:flex;gap:8px;align-items:center}
.sync-indicator{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulseDot 2s infinite}
.sync-dot.off{background:var(--orange)}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.5}}

/* CARDS */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--radius);padding:16px;text-align:center}
.stat .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:24px;font-weight:800;margin-top:6px}
.stat .sub{font-size:12px;color:var(--text-dim);margin-top:2px}
.stat.green .value{color:var(--green)}
.stat.red .value{color:var(--primary)}
.stat.blue .value{color:var(--blue)}
.stat.orange .value{color:var(--orange)}

/* POS */
.pos-layout{display:grid;grid-template-columns:1fr 400px;gap:12px;height:calc(100vh - 130px)}
.cat-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.cat-btn{padding:8px 16px;border-radius:20px;border:1px solid #334;background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap;font-size:13px}
.cat-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.menu-scroll{overflow-y:auto;max-height:calc(100vh - 220px)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:8px 0}
.menu-item{background:var(--card);border-radius:10px;padding:12px;transition:.15s;border:2px solid transparent;text-align:center}
.menu-item:hover{border-color:var(--primary);transform:translateY(-2px)}
.menu-item .name{font-size:13px;font-weight:600;line-height:1.3;min-height:34px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.item-buttons{display:flex;gap:6px;justify-content:center}
.size-btn{padding:8px 4px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:12px;font-weight:700;flex:1;transition:.15s;min-width:0}
.size-btn:hover{background:var(--primary)}
.size-btn:active{transform:scale(.95)}
.size-btn.half{background:var(--purple)}
.size-btn.half:hover{background:#7d3c98}
.size-btn .sp{display:block;font-size:14px}
.size-btn .sl{display:block;font-size:9px;opacity:.8;font-weight:400}
.cart-panel{background:var(--card);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;max-height:calc(100vh - 150px)}
.cart-header{padding:14px;border-bottom:1px solid #334;display:flex;justify-content:space-between;align-items:center}
.cart-items{flex:1;overflow-y:auto;padding:8px;min-height:80px}
.cart-row{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #1a2540;font-size:13px}
.cart-row .ci-name{flex:1}
.cart-row .ci-qty{display:flex;align-items:center;gap:6px}
.qty-btn{width:26px;height:26px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.qty-btn:hover{background:var(--primary)}
.cart-footer{padding:14px;border-top:1px solid #334}
.cart-total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-bottom:10px}
.disc-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.disc-btn{padding:6px 10px;border-radius:8px;border:1px solid #445;background:var(--card);color:var(--text);cursor:pointer;font-size:12px}
.disc-btn.active{background:var(--orange);border-color:var(--orange);color:#fff}
.mode-row{display:flex;gap:6px;margin-bottom:8px}
.mode-btn{flex:1;padding:8px;border-radius:8px;border:1px solid #445;background:var(--card);color:var(--text);cursor:pointer;font-size:12px;font-weight:600;text-align:center}
.mode-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.split-inputs{display:none;gap:6px;margin-bottom:8px}
.split-inputs.show{display:flex}
.split-inputs input{flex:1;padding:8px;border-radius:8px;background:#0d1b2a;color:#fff;border:1px solid #334;font-size:13px}
.btn{padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;width:100%}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-outline{background:transparent;border:1px solid #445;color:var(--text);width:100%}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px;width:auto}

/* TABLES */
.floor{margin-bottom:20px}
.floor h3{color:var(--text-dim);font-size:14px;margin-bottom:8px}
.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.table-box{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s;font-weight:700}
.table-box:hover{transform:scale(1.05)}
.table-box.available{background:#1a3a2a;color:var(--green);border:2px solid #27ae6040}
.table-box.occupied{background:#3a1a1a;color:var(--primary);border:2px solid #c0392b50}
.table-box.reserved{background:#3a3010;color:var(--orange);border:2px solid #f39c1250}
.table-box .tn{font-size:20px}
.table-box .ts{font-size:10px;font-weight:400;margin-top:2px}
.table-opts{display:flex;flex-direction:column;gap:10px}
.table-opt-btn{padding:16px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;text-align:left;display:flex;align-items:center;gap:12px;transition:.15s}
.table-opt-btn:active{transform:scale(.97)}
.table-opt-btn .ic{font-size:24px}

/* KITCHEN */
.kot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.kot-card{background:var(--card);border-radius:12px;padding:14px;border-left:4px solid var(--orange)}
.kot-card.new{border-left-color:var(--orange);animation:pulseCard 2s infinite}
.kot-card.served{border-left-color:var(--green);opacity:.6}
.kot-card.cooking{border-left-color:var(--blue)}
@keyframes pulseCard{0%,100%{box-shadow:0 0 0 0 rgba(243,156,18,.3)}50%{box-shadow:0 0 0 8px rgba(243,156,18,0)}}
.kot-card .kh{display:flex;justify-content:space-between;margin-bottom:8px}
.kot-card .kid{font-weight:700;color:var(--orange)}
.kot-card .ktime{font-size:12px;color:var(--text-dim)}
.kot-card .kitems{font-size:13px;margin-bottom:10px}
.kot-card .ki{padding:4px 0;border-bottom:1px solid #1a2540;display:flex;justify-content:space-between}
.kot-actions{display:flex;gap:6px}

/* FORMS */
.form-row{display:flex;gap:10px;margin-bottom:10px}
.form-row>div{flex:1}
.form-row label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px;border:1px solid #334;border-radius:8px;background:#0d1b2a;color:#fff;font-size:14px}

/* TABLE / LIST */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px;color:var(--text-dim);border-bottom:1px solid #334;font-size:11px;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
.tbl td{padding:8px;border-bottom:1px solid #1a2540}
.tbl tr:hover{background:#ffffff08}
.action-icon{cursor:pointer;font-size:16px;padding:2px 4px}

/* CHAT */
.chat-box{max-width:650px;margin:0 auto}
.chat-msg{margin-bottom:10px;padding:12px 16px;border-radius:12px;max-width:80%;font-size:14px;line-height:1.5}
.chat-msg.user{background:var(--primary);margin-left:auto}
.chat-msg.ai{background:var(--card)}
.chat-input{display:flex;gap:8px;position:sticky;bottom:0;padding-top:8px}
.chat-input input{flex:1;padding:12px;border:1px solid #334;border-radius:10px;background:#0d1b2a;color:#fff;font-size:14px}
.quick-q{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.quick-q button{padding:6px 12px;border-radius:20px;border:1px solid #445;background:var(--card);color:var(--text);cursor:pointer;font-size:12px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--dark2);border-radius:16px;padding:24px;width:440px;max-width:90vw;max-height:85vh;overflow-y:auto}
.modal.wide{width:520px}
.modal h3{margin-bottom:16px;font-size:18px}
.modal-close{float:right;cursor:pointer;font-size:22px;color:var(--text-dim);line-height:1}

/* PRINT */
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;display:block!important}}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark2);color:#fff;padding:12px 24px;border-radius:10px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.4);transition:.3s;opacity:0;pointer-events:none;border:1px solid #334;font-weight:600}
#toast.show{opacity:1;bottom:40px}
#toast.error{border-color:var(--primary)}

.tab-bar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{padding:6px 14px;border-radius:20px;background:var(--card);cursor:pointer;font-size:13px;white-space:nowrap}
.tab.active{background:var(--primary);color:#fff}
.scroll-y{overflow-y:auto}
</style>
</head>
<body>
<div id="app">

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div style="font-size:48px;margin-bottom:8px">🍜</div>
    <h1>Indus Wok POS</h1>
    <p>The Flavours of Indus Wok</p>
    <div class="role-pills">
      <div class="role-pill active" onclick="quickFill('Owner')">Owner</div>
      <div class="role-pill" onclick="quickFill('Manager')">Manager</div>
      <div class="role-pill" onclick="quickFill('Captain')">Captain</div>
      <div class="role-pill" onclick="quickFill('Jannat')">Staff</div>
    </div>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="off" value="Owner">
    <div class="pin-display" id="pinDisplay">●●●●</div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="pinPress('1')">1</button>
      <button class="pin-btn" onclick="pinPress('2')">2</button>
      <button class="pin-btn" onclick="pinPress('3')">3</button>
      <button class="pin-btn" onclick="pinPress('4')">4</button>
      <button class="pin-btn" onclick="pinPress('5')">5</button>
      <button class="pin-btn" onclick="pinPress('6')">6</button>
      <button class="pin-btn" onclick="pinPress('7')">7</button>
      <button class="pin-btn" onclick="pinPress('8')">8</button>
      <button class="pin-btn" onclick="pinPress('9')">9</button>
      <button class="pin-btn" onclick="pinClear()" style="font-size:14px">⌫</button>
      <button class="pin-btn" onclick="pinPress('0')">0</button>
      <button class="pin-btn" onclick="doLogin()" style="background:var(--green)">✓</button>
    </div>
    <p style="margin-top:16px;font-size:11px;color:var(--text-dim)">Default PIN: 1234 for all users</p>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">
  <div class="sidebar">
    <div class="logo">🍜</div>
    <button class="nav-btn active" data-view="dashboard" onclick="showView('dashboard')" title="Dashboard">📊</button>
    <button class="nav-btn" data-view="tables" onclick="showView('tables')" title="Tables">🪑</button>
    <button class="nav-btn" data-view="pos" onclick="showView('pos')" title="POS / Billing">🧾</button>
    <button class="nav-btn" data-view="kitchen" onclick="showView('kitchen')" title="Kitchen"><span id="kotBadge"></span>🍳</button>
    <button class="nav-btn" data-view="orders" onclick="showView('orders')" title="All Orders / Reprint">🖨️</button>
    <button class="nav-btn" data-view="sales" onclick="showView('sales')" title="Sales & Expenses">💰</button>
    <button class="nav-btn" data-view="inventory" onclick="showView('inventory')" title="Inventory">📦</button>
    <button class="nav-btn" data-view="staff" onclick="showView('staff')" title="Staff">👥</button>
    <button class="nav-btn" data-view="ai" onclick="showView('ai')" title="AI Assistant">🤖</button>
    <button class="nav-btn" data-view="settings" onclick="showView('settings')" title="Settings" style="margin-top:auto">⚙️</button>
  </div>
  <div class="content" id="content"></div>
</div>

</div>
<div id="toast"></div>
<div id="modalContainer"></div>
<div id="printArea"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEpsWSmDbvm5zhdg208n4kDrbUV_nXf5Np0mSqhN8cGxOkwbn0FmJHtwfB9XBHQLJ4/exec';
const RESTAURANT_NAME = 'The Flavours of Indus Wok';

// ============================================================
// STATE
// ============================================================
let currentUser = null;
let pinBuffer = '';
let currentView = 'dashboard';
let menuItems = [];
let cart = [];
let currentCategory = 'all';
let tablesData = [];
let allOrders = [];
let allKOTs = [];
let selectedTable = null;
let paymentMode = 'Cash';
let discountType = null;
let discountValue = 0;
let syncTimer = null;
let online = true;

// ============================================================
// PRINTER SETTINGS (localStorage — per device)
// ============================================================
let printerSettings = {};
try { printerSettings = JSON.parse(localStorage.getItem('iw_printer') || '{}'); } catch(e) {}
function psGet(key, def) { return printerSettings[key] !== undefined ? printerSettings[key] : def; }
function psSet(key, val) { printerSettings[key] = val; localStorage.setItem('iw_printer', JSON.stringify(printerSettings)); }

// ============================================================
// ESC/POS COMMAND CONSTANTS (for RawBT text format)
// ============================================================
const C_ESC = String.fromCharCode(27);
const C_GS  = String.fromCharCode(29);
const C_INIT     = C_ESC + '@';                        // Initialize printer
const C_CENTER   = C_ESC + 'a' + String.fromCharCode(1); // Center align
const C_LEFT     = C_ESC + 'a' + String.fromCharCode(0); // Left align
const C_RIGHT    = C_ESC + 'a' + String.fromCharCode(2); // Right align
const C_BOLD_ON  = C_ESC + 'E' + String.fromCharCode(1); // Bold on
const C_BOLD_OFF = C_ESC + 'E' + String.fromCharCode(0); // Bold off
const C_DOUBLE   = C_GS + '!' + String.fromCharCode(17); // Double width + height
const C_NORMAL   = C_GS + '!' + String.fromCharCode(0);  // Normal size
const C_CUT      = C_GS + 'V' + String.fromCharCode(0);  // Full cut
const C_LF       = '\n';
let pendingPrintText = '';

// ESC/POS QR Code command (RawBT interprets this and prints a real QR)
function escposQR(data, moduleSize) {
  moduleSize = moduleSize || 6;
  let c = '';
  // 1) Set module size:  GS ( k  pL=3 pH=0  cn=49('1') fn=67('C') n=size
  c += C_GS + '(k\x03\x00\x31\x43' + String.fromCharCode(moduleSize);
  // 2) Set error level M: GS ( k  pL=3 pH=0  cn=49('1') fn=69('E') n=49(M)
  c += C_GS + '(k\x03\x00\x31\x45\x31';
  // 3) Store data:        GS ( k  pL pH     cn=48('0') fn=80('P') + data
  const len = data.length + 3;
  c += C_GS + '(k' + String.fromCharCode(len & 255) + String.fromCharCode((len >> 8) & 255) + '\x30\x50' + data;
  // 4) Print QR:          GS ( k  pL=3 pH=0  cn=48('0') fn=48('0')
  c += C_GS + '(k\x03\x00\x30\x30';
  return c;
}

// Pad left/right to fill the line width
function escLine(left, right, W) {
  left = String(left); right = String(right);
  const space = W - left.length - right.length;
  if (space < 1) {
    const maxLeft = Math.max(1, W - right.length - 1);
    return left.substring(0, maxLeft) + ' ' + right;
  }
  return left + ' '.repeat(space) + right;
}

// ============================================================
// API HELPER
// ============================================================
async function api(action, params={}) {
  const payload = JSON.stringify({
    action, params,
    username: currentUser ? currentUser.username : 'system',
    role: currentUser ? currentUser.role : 'Staff'
  });
  try {
    const url = SCRIPT_URL + '?payload=' + encodeURIComponent(payload);
    const res = await fetch(url);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { return { success:false, message:'Bad response: ' + text.substring(0,100) }; }
    setOnline(true);
    return data;
  } catch(e) {
    setOnline(false);
    return { success:false, message:'Network error: ' + e.message };
  }
}

function setOnline(val) {
  online = val;
  document.querySelectorAll('.sync-dot').forEach(d => d.className = 'sync-dot' + (val ? '' : ' off'));
}

// ============================================================
// TOAST
// ============================================================
function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 3000);
}

// ============================================================
// LOGIN
// ============================================================
function quickFill(user) {
  document.getElementById('loginUser').value = user;
  document.querySelectorAll('.role-pill').forEach(p => p.classList.toggle('active', p.textContent === user));
  pinBuffer = '';
  updatePinDisplay();
}
function pinPress(d) { if (pinBuffer.length < 4) { pinBuffer += d; updatePinDisplay(); if (pinBuffer.length === 4) setTimeout(doLogin, 200); } }
function pinClear() { pinBuffer = pinBuffer.slice(0,-1); updatePinDisplay(); }
function updatePinDisplay() {
  const d = document.getElementById('pinDisplay');
  d.textContent = pinBuffer.length > 0 ? '●'.repeat(pinBuffer.length) + '○'.repeat(4 - pinBuffer.length) : '○○○○';
}
document.addEventListener('keydown', e => {
  if (document.getElementById('loginScreen').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') pinPress(e.key);
  else if (e.key === 'Enter') doLogin();
  else if (e.key === 'Backspace') { e.preventDefault(); pinClear(); }
});

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  if (!username || !pinBuffer) { toast('Enter username and PIN', true); return; }
  toast('Logging in...');
  const res = await api('LOGIN', { username, pin: pinBuffer });
  if (res.success) {
    currentUser = res.user;
    pinBuffer = '';
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    await api('DAY_IN', { username: currentUser.username, name: currentUser.name, role: currentUser.role });
    startLiveSync();
    showView('dashboard');
    toast('Welcome ' + currentUser.name + '!');
  } else {
    toast(res.message || 'Login failed', true);
    pinClear();
  }
}

// ============================================================
// LIVE SYNC
// ============================================================
function startLiveSync() {
  if (syncTimer) clearInterval(syncTimer);
  syncPoll();
  syncTimer = setInterval(syncPoll, 5000);
}

async function syncPoll() {
  if (!currentUser) return;
  const res = await api('CHECK_SYNC');
  if (!res.success) return;
  if (res.tableStatuses) tablesData = res.tableStatuses;
  if (currentView === 'tables') renderTables();
  if (currentView === 'kitchen' && res.newKOTs) renderKitchen(res.newKOTs);
  const newKots = (res.newKOTs || []).filter(k => k.status === 'New' || k.status === 'Cooking');
  const badge = document.getElementById('kotBadge');
  if (badge) badge.innerHTML = newKots.length > 0 ? '<span class="badge">'+newKots.length+'</span>' : '';
  if (currentView === 'orders' && res.newOrders) renderOrdersList(res.newOrders);
}

// ============================================================
// VIEW ROUTER
// ============================================================
function showView(view) {
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  switch(view) {
    case 'dashboard': renderDashboard(); break;
    case 'tables': renderTables(); break;
    case 'pos': renderPOS(); break;
    case 'kitchen': document.getElementById('content').innerHTML = kitchenHTML(); loadKOTs(); break;
    case 'orders': renderOrdersPage(); break;
    case 'sales': renderSales(); break;
    case 'inventory': renderInventory(); break;
    case 'staff': renderStaff(); break;
    case 'ai': renderAI(); break;
    case 'settings': renderSettings(); break;
  }
}

async function renderTables() {
  const c = document.getElementById('content');
  if (tablesData.length === 0) {
    c.innerHTML = '<p style="color:var(--text-dim)">Loading tables...</p>';
    const res = await api('GET_TABLES');
    if (res.success) tablesData = res.tables;
  }
  const occupied = tablesData.filter(t=>t.status==='Occupied').length;
  c.innerHTML = `<div class="topbar"><h2>🪑 Tables</h2><div class="sync-indicator"><span class="sync-dot"></span>Live · ${occupied} occupied</div></div>`;
  const floors = {};
  tablesData.forEach(t => { if (!floors[t.area]) floors[t.area] = []; floors[t.area].push(t); });
  let html = '';
  for (const area in floors) {
    html += `<div class="floor"><h3>${area}</h3><div class="table-grid">`;
    html += floors[area].map(t => `
      <div class="table-box ${t.status.toLowerCase()}" onclick="openTableOptions('${t.tableNo}','${t.status}','${esc(t.orderId||'')}','${esc(t.customerName||'')}')">

        <div class="ts">${t.status}</div>
      </div>`).join('');

  }
  html += `<div style="display:flex;gap:10px;margin-top:12px">

    <button class="btn btn-orange btn-sm" onclick="quickOrder('Delivery')">🚚 Delivery</button>

function openTableOptions(tableNo, status, orderId, customerName) {
  showModal('Table ' + tableNo, `
    <p style="color:var(--text-dim);margin-bottom:16px">Status: <strong style="color:${status==='Available'?'var(--green)':'var(--primary)'}">${status}</strong>${customerName?' · '+customerName:''}</p>
    <div class="table-opts">
      <div class="table-opt-btn" style="background:var(--green);color:#fff" onclick="closeModal();startBilling('${tableNo}')">
        <span class="ic">🧾</span> Open Billing

      <div class="table-opt-btn" style="background:var(--blue);color:#fff" onclick="closeModal();reprintTableBill('${tableNo}','${orderId}')">

      </div>
      <div class="table-opt-btn" style="background:${status==='Available'?'#334':'var(--primary)'};color:#fff" onclick="closeModal();freeTable('${tableNo}')" ${status==='Available'?'disabled style="opacity:.5;cursor:not-allowed"':''}>

function startBilling(tableNo) {
  selectedTable = tableNo;
  showView('pos');
}

async function freeTable(tableNo) {
  toast('Freeing table...');
  const res = await api('UPDATE_TABLE', { tableNo, status:'Available', currentOrderID:'', customerName:'' });
  if (res.success) {
    tablesData = tablesData.map(t => t.tableNo === tableNo ? {...t, status:'Available', orderId:''} : t);
    renderTables();
    toast('Table ' + tableNo + ' is now free');
  }
}

function quickOrder(type) {
  selectedTable = null;
  showView('pos');
  setTimeout(() => {
    const sel = document.getElementById('orderType');
    if (sel) sel.value = type;
    onOrderTypeChange();
  }, 300);
}

async function reprintTableBill(tableNo, orderId) {
  if (!orderId || orderId === '') { toast('No active order on this table', true); return; }
  const res = await api('GET_ORDERS');
  if (!res.success) return;
  const order = res.orders.find(o => o.orderId === orderId);
  if (!order) { toast('Order not found', true); return; }
  printBill(order, tableNo);
}

    if (!opts) opts = tablesData.map(t=>`<option value="${t.tableNo}">${t.tableNo}</option>`).join('');
    ts.innerHTML = `<div class="form-row" style="margin-bottom:8px"><div><label>Table</label><select id="selTable" style="padding:10px">${opts}</select></div></div>`;
    cf.innerHTML = '';
  } else {
    ts.innerHTML = '';
    cf.innerHTML = `<div class="form-row" style="margin-bottom:8px">
      <div><label>Customer Name</label><input type="text" id="custName" placeholder="Name"></div>
      <div><label>Phone</label><input type="text" id="custPhone" placeholder="Phone"></div>
      </div>${ot==='Delivery'||ot==='Zomato'||ot==='Swiggy'?'<div class="form-row" style="margin-bottom:8px"><div><label>Address</label><input type="text" id="custAddr" placeholder="Delivery address"></div></div>':''}`;

}

function setCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.textContent === cat));
  renderMenuGrid();
}

function renderMenuGrid() {
  const items = currentCategory === 'all' ? menuItems : menuItems.filter(m=>m.category===currentCategory);
  const el = document.getElementById('menuGrid');
  if (!el) return;
  el.innerHTML = items.map(m => {
    const hasHalf = m.halfPrice && Number(m.halfPrice) > 0;
    if (hasHalf) {
      return `<div class="menu-item">
        <div class="name">${m.itemName}</div>
        <div class="item-buttons">
          <button class="size-btn" onclick="event.stopPropagation();addToCart('${esc(m.itemName)}', ${m.fullPrice}, 'FULL')"><span class="sp">₹${m.fullPrice}</span><span class="sl">FULL</span></button>
          <button class="size-btn half" onclick="event.stopPropagation();addToCart('${esc(m.itemName)}', ${m.halfPrice}, 'HALF')"><span class="sp">₹${m.halfPrice}</span><span class="sl">HALF</span></button>
        </div>
      </div>`;
    } else {
      return `<div class="menu-item">
        <div class="name">${m.itemName}</div>
        <div class="item-buttons">
          <button class="size-btn" onclick="event.stopPropagation();addToCart('${esc(m.itemName)}', ${m.fullPrice}, 'FULL')"><span class="sp">₹${m.fullPrice}</span><span class="sl">FULL</span></button>
        </div>
      </div>`;
    }
  }).join('') || '<p style="color:var(--text-dim)">No items</p>';
}

function addToCart(name, price, size) {
  const existing = cart.find(c => c.name === name && c.size === size);
  if (existing) { existing.qty++; }
  else cart.push({ name, price: Number(price), size, qty: 1 });
  renderCart();
  toast('+ ' + name + ' (' + size + ')');
}

function renderCart() {
  const el = document.getElementById('cartItems');
  if (!el) return;
  if (cart.length === 0) { el.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:20px">Tap menu items to add</p>'; }
  else {
    el.innerHTML = cart.map((c,i) => `
      <div class="cart-row">
        <div class="ci-name">${c.name}${c.size==='HALF'?' <span style="color:var(--purple);font-size:11px">(H)</span>':''}<br><span style="color:var(--text-dim);font-size:11px">₹${c.price}</span></div>
        <div class="ci-qty">
          <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
          <span style="min-width:24px;text-align:center;font-weight:700">${c.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
        </div>
        <div style="width:60px;text-align:right;font-weight:700">₹${c.price*c.qty}</div>
      </div>`).join('');
  }
  const cnt = document.getElementById('cartCount');
  if (cnt) cnt.textContent = cart.reduce((a,c)=>a+c.qty,0);
  updateCartTotal();
}

function changeQty(i, delta) {
  cart[i].qty += delta;
  if (cart[i].qty <= 0) cart.splice(i,1);
  renderCart();
}

function getSubtotal() { return cart.reduce((a,c)=>a+c.price*c.qty,0); }
function getDiscountAmount() {
  const sub = getSubtotal();
  if (discountType === 'pct') return Math.round(sub * discountValue / 100);
  if (discountType === 'flat') return discountValue;
  return 0;
}
function getTotal() { return Math.max(0, getSubtotal() - getDiscountAmount()); }

function setDiscount(type, val) {
  discountType = type === 'none' ? null : type;
  discountValue = val;
  updateDiscActive();
  updateCartTotal();
}
function updateDiscActive() {
  document.querySelectorAll('.disc-btn').forEach(b => {
    const txt = b.textContent;
    let match = false;
    if (discountType === 'pct' && txt === discountValue + '%') match = true;
    if (discountType === 'flat' && txt === '₹' + discountValue) match = true;
    if (!discountType && txt === 'Clear') match = true;
    b.classList.toggle('active', match);
  });
}

function setMode(mode) {
  paymentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.textContent.trim().startsWith(mode)));
  document.getElementById('splitInputs').classList.toggle('show', mode === 'Split');
  updateCartTotal();
}

function updateCartTotal() {
  const el = document.getElementById('cartTotal');
  if (el) el.textContent = '₹' + getTotal();
}

function clearCart() { cart = []; discountType=null; discountValue=0; updateDiscActive(); renderCart(); }

function getOrderParams(extra) {
  const orderType = document.getElementById('orderType')?.value || 'Dine-in';
  const tableNo = document.getElementById('selTable')?.value || selectedTable || '';
  const total = getTotal();
  let cashAmt=0, upiAmt=0, cardAmt=0;
  if (paymentMode === 'Cash') cashAmt = total;
  else if (paymentMode === 'UPI') upiAmt = total;
  else if (paymentMode === 'Card') cardAmt = total;
  else if (paymentMode === 'Split') {
    cashAmt = Number(document.getElementById('splitCash')?.value||0);
    upiAmt = Number(document.getElementById('splitUPI')?.value||0);
    cardAmt = Number(document.getElementById('splitCard')?.value||0);
  }
  return Object.assign({
    tableNo, items: [...cart], total,
    discount: getDiscountAmount(), tax: 0,
    paymentMode, cashAmt, upiAmt, cardAmt, orderType,
    customerName: document.getElementById('custName')?.value || '',
    customerPhone: document.getElementById('custPhone')?.value || '',
    deliveryAddress: document.getElementById('custAddr')?.value || ''
  }, extra||{});
}

async function settleOrder() {
  if (cart.length === 0) { toast('Cart is empty!', true); return; }
  const params = getOrderParams({ status: 'Completed' });
  toast('Settling order...');
  const res = await api('PLACE_ORDER', params);
  if (res.success) {
    await api('ADD_SALE', { totalSales: params.total, cash: params.cashAmt, upi: params.upiAmt, card: params.cardAmt, ordersCount: 1, notes: res.orderId, date: todayStr() });
    // Fetch and print the settled bill
    const ordersRes = await api('GET_ORDERS');
    const order = ordersRes.success ? ordersRes.orders.find(o=>o.orderId===res.orderId) : null;
    if (order) printBill(order, params.tableNo);
    toast('Order ' + res.orderId + ' settled!');
    clearCart();
    tablesData = tablesData.map(t => t.tableNo === params.tableNo ? {...t, status:'Available', orderId:''} : t);
    selectedTable = null;
    setTimeout(() => showView('tables'), 500);
  } else toast(res.message || 'Failed', true);
}

async function printKOT() {
  if (cart.length === 0) { toast('Cart is empty!', true); return; }
  const orderType = document.getElementById('orderType')?.value || 'Dine-in';
  const tableNo = document.getElementById('selTable')?.value || selectedTable || '';
  toast('Sending to kitchen...');
  const res = await api('PRINT_KOT', { items: [...cart], tableNo, station: 'Main', orderId: '' });
  if (res.success) {
    // Also place order as pending
    const params = getOrderParams({ status: 'Pending', paymentMode:'Pending', cashAmt:0, upiAmt:0, cardAmt:0 });
    const orderRes = await api('PLACE_ORDER', params);
    printKOTReceipt(res.kotId, tableNo, orderType, cart);
    toast('KOT ' + res.kotId + ' sent to kitchen!');
    tablesData = tablesData.map(t => t.tableNo === tableNo ? {...t, status:'Occupied', orderId: orderRes.success ? orderRes.orderId : ''} : t);
  } else toast(res.message||'Failed', true);
}

function printPreviewBill() {
  if (cart.length === 0) { toast('Cart is empty!', true); return; }
  const orderType = document.getElementById('orderType')?.value || 'Dine-in';
  const tableNo = document.getElementById('selTable')?.value || selectedTable || '';
  printBill({
    orderId: 'PREVIEW', items: JSON.stringify(cart), total: getTotal(),
    discount: getDiscountAmount(), tax:0, paymentMode: paymentMode,
    orderType, customerName: document.getElementById('custName')?.value||'',
    timestamp: new Date().toISOString()
  }, tableNo);
}

function renderKitchen(kots) {
  const grid = document.getElementById('kotGrid');
  if (!grid) return;
  const active = kots.filter(k => k.status !== 'SERVED');
  if (active.length === 0) { grid.innerHTML = '<div class="card" style="text-align:center;color:var(--green)">✅ All orders served!</div>'; return; }
  grid.className = 'kot-grid';

// ============================================================
// PRINT ENGINE — RawBT ESC/POS text format (58mm with QR)
// ============================================================

// ---- BILL (customer receipt with UPI QR) ----
function buildBillESCPOS(order, tableNo) {
  const W = psGet('printerWidth', '58') === '80' ? 48 : 32;
  let items = [];
  try { items = typeof order.items === 'string' ? JSON.parse(order.items) : (order.items || []); } catch(e) {}
  const total = Number(order.total) || 0;
  const discount = Number(order.discount) || 0;
  const subTotal = total + discount;
  const now = new Date(order.timestamp || new Date());
  const billNo = order.orderId ? order.orderId.replace('ORD-', '').slice(-8) : '---';
  const dash = '-'.repeat(W);

  let t = '';
  t += C_INIT + C_CENTER;

  // Header
  t += C_BOLD_ON + C_DOUBLE;
  t += (psGet('restName', RESTAURANT_NAME) || RESTAURANT_NAME) + C_LF;
  t += C_NORMAL + C_BOLD_OFF;
  if (psGet('restTagline', '')) t += psGet('restTagline', '') + C_LF;
  if (psGet('restPhone', ''))   t += 'Ph: ' + psGet('restPhone', '') + C_LF;
  if (psGet('restAddr1', ''))   t += psGet('restAddr1', '') + C_LF;
  if (psGet('restAddr2', ''))   t += psGet('restAddr2', '') + C_LF;
  if (psGet('gstin', ''))       t += 'GSTIN: ' + psGet('gstin', '') + C_LF;

  t += C_LEFT + dash + C_LF;

  // Bill info
  t += escLine('Bill:', billNo, W) + C_LF;
  t += escLine('Date:', formatDateShort(now), W) + C_LF;
  t += escLine('Time:', formatTime(now), W) + C_LF;
  t += escLine('Type:', order.orderType || 'Dine-in', W) + C_LF;
  if (tableNo)            t += escLine('Table:', tableNo, W) + C_LF;
  if (order.customerName) t += escLine('Cust:', order.customerName, W) + C_LF;

  t += dash + C_LF;

  // Items
  for (const i of items) {
    const name = i.qty + 'x ' + i.name + (i.size === 'HALF' ? '(H)' : '');
    t += escLine(name, String(i.price * i.qty), W) + C_LF;
  }

  t += dash + C_LF;

  // Totals
  t += escLine('Subtotal:', String(subTotal), W) + C_LF;
  if (discount > 0) t += escLine('Discount:', '-' + discount, W) + C_LF;
  t += C_BOLD_ON + escLine('TOTAL:', String(total), W) + C_LF + C_BOLD_OFF;

  // Payment breakdown
  if (Number(order.cashAmt) > 0) t += escLine('Cash:', String(order.cashAmt), W) + C_LF;
  if (Number(order.upiAmt)  > 0) t += escLine('UPI:',  String(order.upiAmt),  W) + C_LF;
  if (Number(order.cardAmt) > 0) t += escLine('Card:', String(order.cardAmt), W) + C_LF;

  // UPI Payment QR Code
  const upiId = psGet('upiId', '');
  if (upiId) {
    t += dash + C_LF + C_CENTER;
    const upiStr = 'upi://pay?pa=' + upiId +
      '&pn=' + encodeURIComponent(psGet('restName', RESTAURANT_NAME)) +
      '&am=' + total + '&cu=INR&tn=Bill' + billNo;
    t += escposQR(upiStr, psGet('qrSize', 6));
    t += 'Scan to Pay Rs.' + total + C_LF;
    t += C_LEFT;
  }

  // Footer
  t += dash + C_LF + C_CENTER;
  t += C_BOLD_ON + (psGet('thankYouMsg', '*** Thank You! ***') || '*** Thank You! ***') + C_LF + C_BOLD_OFF;
  t += 'Visit Again!' + C_LF + C_LEFT;
  t += C_LF + C_LF + C_CUT;
  return t;
}

// ---- KOT (kitchen ticket) ----
function buildKOTESCPOS(kotId, tableNo, orderType, items) {
  const W = psGet('printerWidth', '58') === '80' ? 48 : 32;
  if (!items) items = [];
  const now = new Date();
  const dash = '-'.repeat(W);

  let t = '';
  t += C_INIT + C_CENTER;
  t += C_DOUBLE + C_BOLD_ON;
  t += 'KOT' + C_LF;
  t += C_NORMAL + C_BOLD_OFF;
  t += dash + C_LF + C_LEFT;
  t += escLine('KOT:', kotId, W) + C_LF;
  t += escLine('Time:', formatTime(now), W) + C_LF;
  if (tableNo)  t += escLine('Table:', tableNo, W) + C_LF;
  if (orderType) t += escLine('Type:', orderType, W) + C_LF;
  t += dash + C_LF;

  // Items in larger font for kitchen readability
  t += C_DOUBLE;
  for (const i of items) {
    t += i.qty + 'x ' + i.name + (i.size === 'HALF' ? ' (H)' : '') + C_LF;
  }
  t += C_NORMAL;

  t += dash + C_LF + C_CENTER;
  t += '--- PREPARE ---' + C_LF + C_LEFT;
  t += C_LF + C_LF + C_CUT;
  return t;
}

// ---- Entry points (auto-print or preview) ----
function printBill(order, tableNo) {
  const escText = buildBillESCPOS(order, tableNo);
  if (psGet('autoPrint', false)) sendRawBT(escText);
  else showPrintPreview(escText, 'Bill ' + (order.orderId || ''));
}

function printKOTReceipt(kotId, tableNo, orderType, items) {
  const escText = buildKOTESCPOS(kotId, tableNo, orderType, items);
  if (psGet('autoPrint', false)) sendRawBT(escText);
  else showPrintPreview(escText, 'KOT ' + kotId);
}

// ---- Send ESC/POS text to RawBT ----
async function sendRawBT(escText) {
  // 1) Copy to clipboard (RawBT clipboard-monitor mode picks it up)
  let copied = false;
  try {
    await navigator.clipboard.writeText(escText);
    copied = true;
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = escText;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); copied = true; } catch(e2) {}
    document.body.removeChild(ta);
  }

  // 2) Try Android Web Share (RawBT appears in share sheet)
  if (navigator.share) {
    try {
      await navigator.share({ title: 'RawBT Print', text: escText });
      toast('Sent to RawBT!');
      return;
    } catch(e) { /* cancelled — fall through */ }
  }

  // 3) Clipboard was filled
  if (copied) toast('Copied to clipboard — paste in RawBT');
  else toast('Could not copy — check permissions', true);
}

// ---- Preview modal ----
function showPrintPreview(escText, title) {
  pendingPrintText = escText;
  const preview = escTextToPreview(escText);
  showModal('🖨️ ' + title,
    '<div style="background:#fff;color:#000;border-radius:8px;padding:14px;margin-bottom:12px;font-family:\'Courier New\',monospace;font-size:11px;line-height:1.5;white-space:pre;overflow-x:auto">' + preview + '</div>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="btn btn-green" style="flex:1" onclick="sendRawBT(pendingPrintText);closeModal();">🖨️ Send to RawBT</button>' +
    '<button class="btn btn-outline" style="width:auto" onclick="copyPrintText()">📋 Copy</button>' +
    '</div>' +
    '<p style="font-size:11px;color:var(--text-dim);margin-top:8px">Enable RawBT clipboard monitor for auto-print, or use Android Share.</p>'
  );
}

function copyPrintText() {
  navigator.clipboard.writeText(pendingPrintText).then(() => toast('Copied!')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = pendingPrintText;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Copied!');
  });
}

// Strip ESC/POS control bytes for on-screen preview
function escTextToPreview(escText) {
  let out = '';
  for (let i = 0; i < escText.length; i++) {
    const c = escText.charCodeAt(i);
    if (c === 10) out += '\n';
    else if (c >= 32 && c < 127) out += escText[i];
  }
  // Add QR placeholder note
  if (psGet('upiId', '')) out += '\n  [ UPI QR CODE ]\n  Scan to Pay';
  return out.trim();
}

// ---- Time / date helpers ----
function formatTime(d) {
  const h = String(d.getHours() || 0).padStart(2, '0');
  const m = String(d.getMinutes() || 0).padStart(2, '0');
  return h + ':' + m;
}
function formatDateShort(d) {
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
}
function fmtTime(ts) { try { return formatTime(new Date(ts)); } catch(e) { return ''; } }

async function loadSmartStock() {
  document.getElementById('invContent').innerHTML = '<p style="color:var(--text-dim)">Analyzing...</p>';

function editStock(item, current) {

}

async function addInvItem() {

async function renderStaff() {
  const c = document.getElementById('content');
  c.innerHTML = `<div class="topbar"><h2>👥 Staff Management</h2></div>
    <div class="tab-bar"><div class="tab active" onclick="staffTab(this,'list')">Staff List</div><div class="tab" onclick="staffTab(this,'att')">Attendance</div><div class="tab" onclick="staffTab(this,'add')">+ Add Staff</div></div>
    <div id="staffContent"></div>`;
  staffTab(document.querySelector('.tab.active'), 'list');
}

function staffTab(el, tab) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if (tab === 'list') loadStaffList();
  else if (tab === 'att') loadAttendance();
  else {
    document.getElementById('staffContent').innerHTML = `<div class="card">
      <div class="form-row"><div><label>Name</label><input type="text" id="stName"></div><div><label>Phone</label><input type="text" id="stPhone"></div></div>
      <div class="form-row"><div><label>Role</label><select id="stRole"><option>Staff</option><option>Chef</option><option>Helper</option><option>Waiter</option><option>Captain</option><option>Cashier</option></select></div><div><label>Salary</label><input type="number" id="stSalary" value="0"></div></div>
      <div class="form-row"><div><label>Address</label><input type="text" id="stAddr"></div></div>
      <button class="btn btn-primary" onclick="addStaff()">Add Staff</button></div>`;
  }
}

async function loadStaffList() {
  document.getElementById('staffContent').innerHTML = '<p style="color:var(--text-dim)">Loading...</p>';
  const res = await api('GET_STAFF');
  if (!res.success) return;
  document.getElementById('staffContent').innerHTML = '<table class="tbl"><tr><th>Name</th><th>Role</th><th>Phone</th><th>Salary</th></tr>' +
    res.staff.map(s => `<tr><td>${s.name}</td><td>${s.role}</td><td>${s.phone||'-'}</td><td>₹${s.salary}</td></tr>`).join('') + '</table>';
}

async function loadAttendance() {
  document.getElementById('staffContent').innerHTML = '<p style="color:var(--text-dim)">Loading...</p>';
  const [staffRes, attRes] = await Promise.all([api('GET_STAFF'), api('GET_ATTENDANCE')]);
  let html = '<div class="card"><h3 style="margin-bottom:8px">Check In / Out</h3><div style="display:flex;gap:8px;flex-wrap:wrap">';
  if (staffRes.success) staffRes.staff.forEach(s => {
    html += `<button class="btn btn-outline btn-sm" onclick="checkInStaff('${esc(s.name)}')">📥 ${s.name} In</button>`;
    html += `<button class="btn btn-outline btn-sm" onclick="checkOutStaff('${esc(s.name)}')">📤 ${s.name} Out</button>`;
  });
  html += '</div></div>';
  if (attRes.success) {
    html += '<div class="card"><table class="tbl"><tr><th>Date</th><th>Name</th><th>In</th><th>Out</th><th>Hrs</th></tr>';
    attRes.attendance.slice(-10).reverse().forEach(a => { html += `<tr><td>${a.date}</td><td>${a.staffName}</td><td>${a.checkIn||''}</td><td>${a.checkOut||''}</td><td>${a.hours||''}</td></tr>`; });
    html += '</table></div>';
  }
  document.getElementById('staffContent').innerHTML = html;
}

async function checkInStaff(name) { const r = await api('CHECK_IN', { staffName:name }); toast(r.success ? name+' checked in at '+r.checkInTime : r.message, !r.success); loadAttendance(); }
async function checkOutStaff(name) { const r = await api('CHECK_OUT', { staffName:name }); toast(r.success ? name+' checked out' : r.message, !r.success); loadAttendance(); }
async function addStaff() {
  const r = await api('ADD_STAFF', {
    name: document.getElementById('stName').value, phone: document.getElementById('stPhone').value,
    role: document.getElementById('stRole').value, salary: Number(document.getElementById('stSalary').value)||0,
    address: document.getElementById('stAddr').value
  });
  toast(r.success ? 'Staff added!' : r.message, !r.success);
}

function renderAI() {
  const c = document.getElementById('content');
  c.innerHTML = `<div class="topbar"><h2>🤖 AI Assistant</h2><button class="btn btn-blue btn-sm" onclick="getPredictions()">📊 Predictions</button></div>
    <div class="chat-box">
      <div class="quick-q">
        <button onclick="quickAsk('How are sales today?')">📊 Sales</button>
        <button onclick="quickAsk('What is low on stock?')">📦 Low Stock</button>
        <button onclick="quickAsk('What is my profit?')">💰 Profit</button>
        <button onclick="quickAsk('Give me a business tip')">💡 Tips</button>
      </div>
      <div id="chatMessages" style="margin-bottom:80px">
        <div class="chat-msg ai">👋 Hi! I'm Indus Wok AI. Ask me about sales, stock, profit, or get predictions!</div>
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn btn-primary" onclick="sendChat()">Send</button>
      </div>
    </div>`;
}

function quickAsk(q) { document.getElementById('chatInput').value = q; sendChat(); }

async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  document.getElementById('chatMessages').innerHTML += `<div class="chat-msg user">${msg}</div>`;
  document.getElementById('chatMessages').innerHTML += `<div class="chat-msg ai" id="thinking">🤔 Thinking...</div>`;
  scrollChat();
  const res = await api('AI_CHAT', { message: msg });
  document.getElementById('thinking').remove();
  document.getElementById('chatMessages').innerHTML += `<div class="chat-msg ai">${res.answer || res.message || 'Sorry, I could not process that.'}</div>`;
  scrollChat();
}

async function getPredictions() {
  document.getElementById('chatMessages').innerHTML += `<div class="chat-msg ai" id="thinking">📊 Analyzing sales data...</div>`;
  scrollChat();
  const res = await api('GET_PREDICTIONS');
  document.getElementById('thinking').remove();
  if (res.success) {
    const p = res.prediction;
    document.getElementById('chatMessages').innerHTML += `<div class="chat-msg ai">
      📈 <strong>Sales Prediction</strong><br>
      Average Daily: ₹${p.averageDaily}<br>
      Predicted Today: ₹${p.predictedToday} (${p.todayDay})<br>
      Best: ₹${p.maxDaily} | Worst: ₹${p.minDaily}<br><br>
      ${p.geminiInsight}
    </div>`;
  }
  scrollChat();
}

function scrollChat() { const el = document.getElementById('chatMessages'); el.scrollTop = el.scrollHeight; }

function logout() {
  if (currentUser) api('DAY_OUT', { username: currentUser.username });

  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  pinClear();
  document.getElementById('loginUser').value = 'Owner';
}
