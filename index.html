<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Indus Wok POS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{--primary:#c0392b;--primary-dark:#962d22;--dark:#1a1a2e;--dark2:#16213e;--card:#1e2a4a;--accent:#0f3460;--green:#27ae60;--orange:#f39c12;--blue:#3498db;--text:#e8e8e8;--text-dim:#8892b0;--radius:12px}
body{background:var(--dark);color:var(--text);overflow:hidden;height:100vh}
#app{height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,var(--dark),var(--dark2))}
.login-box{background:var(--card);padding:40px;border-radius:20px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-box h1{color:var(--primary);font-size:24px;margin-bottom:4px}
.login-box p{color:var(--text-dim);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:14px;margin-bottom:12px;border:1px solid #334;border-radius:10px;background:#0d1b2a;color:#fff;font-size:16px}
.login-box input:focus{outline:none;border-color:var(--primary)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pin-btn{padding:18px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:22px;font-weight:700;cursor:pointer;transition:.15s}
.pin-btn:hover{background:var(--primary)}
.pin-btn:active{transform:scale(.95)}
.pin-display{text-align:center;font-size:28px;letter-spacing:12px;margin:16px 0;color:var(--primary)}

/* LAYOUT */
#mainApp{display:flex;height:100vh}
.sidebar{width:70px;background:var(--dark2);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;flex-shrink:0}
.sidebar .logo{width:44px;height:44px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
.nav-btn{width:50px;height:50px;border:none;border-radius:12px;background:transparent;color:var(--text-dim);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;position:relative}
.nav-btn:hover{background:var(--card);color:#fff}
.nav-btn.active{background:var(--primary);color:#fff}
.nav-btn .badge{position:absolute;top:4px;right:4px;background:var(--green);color:#fff;font-size:10px;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-weight:700}
.content{flex:1;overflow-y:auto;padding:16px 20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.topbar h2{font-size:20px}
.topbar .actions{display:flex;gap:8px;align-items:center}
.sync-indicator{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sync-dot.off{background:var(--orange)}

/* CARDS */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--radius);padding:16px;text-align:center}
.stat .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:26px;font-weight:800;margin-top:6px}
.stat .sub{font-size:12px;color:var(--text-dim);margin-top:2px}
.stat.green .value{color:var(--green)}
.stat.red .value{color:var(--primary)}
.stat.blue .value{color:var(--blue)}
.stat.orange .value{color:var(--orange)}

/* POS */
.pos-layout{display:grid;grid-template-columns:1fr 380px;gap:12px;height:calc(100vh - 100px)}
.cat-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.cat-btn{padding:8px 16px;border-radius:20px;border:1px solid #334;background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap;font-size:13px}
.cat-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;overflow-y:auto;padding:8px 0}
.menu-item{background:var(--card);border-radius:10px;padding:12px;cursor:pointer;transition:.15s;text-align:center;border:2px solid transparent}
.menu-item:hover{border-color:var(--primary);transform:translateY(-2px)}
.menu-item .name{font-size:13px;font-weight:600;line-height:1.3}
.menu-item .price{color:var(--primary);font-weight:700;margin-top:6px;font-size:15px}
.menu-item .half{font-size:11px;color:var(--text-dim)}
.cart-panel{background:var(--card);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.cart-header{padding:14px;border-bottom:1px solid #334;display:flex;justify-content:space-between;align-items:center}
.cart-items{flex:1;overflow-y:auto;padding:8px}
.cart-row{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #1a2540;font-size:13px}
.cart-row .ci-name{flex:1}
.cart-row .ci-qty{display:flex;align-items:center;gap:6px}
.qty-btn{width:24px;height:24px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.cart-footer{padding:14px;border-top:1px solid #334}
.cart-total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-bottom:10px}
.btn{padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;width:100%}
.btn-green{background:var(--green);color:#fff;width:100%}
.btn-blue{background:var(--blue);color:#fff;width:100%}
.btn-outline{background:transparent;border:1px solid #445;color:var(--text)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}

/* TABLES */
.floor{margin-bottom:20px}
.floor h3{color:var(--text-dim);font-size:14px;margin-bottom:8px}
.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.table-box{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s;font-weight:700}
.table-box:hover{transform:scale(1.05)}
.table-box.available{background:#1a3a2a;color:var(--green);border:2px solid #27ae6040}
.table-box.occupied{background:#3a1a1a;color:var(--primary);border:2px solid #c0392b50}
.table-box .tn{font-size:18px}
.table-box .ts{font-size:10px;font-weight:400;margin-top:2px}

/* KITCHEN */
.kot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kot-card{background:var(--card);border-radius:12px;padding:14px;border-left:4px solid var(--orange)}
.kot-card.new{border-left-color:var(--orange);animation:pulse 2s infinite}
.kot-card.served{border-left-color:var(--green);opacity:.6}
.kot-card.cooking{border-left-color:var(--blue)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(243,156,18,.3)}50%{box-shadow:0 0 0 8px rgba(243,156,18,0)}}
.kot-card .kh{display:flex;justify-content:space-between;margin-bottom:8px}
.kot-card .kid{font-weight:700;color:var(--orange)}
.kot-card .ktime{font-size:12px;color:var(--text-dim)}
.kot-card .kitems{font-size:13px;margin-bottom:10px}
.kot-card .ki{padding:4px 0;border-bottom:1px solid #1a2540}
.kot-actions{display:flex;gap:6px}

/* FORMS */
.form-row{display:flex;gap:10px;margin-bottom:10px}
.form-row>div{flex:1}
.form-row label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px;border:1px solid #334;border-radius:8px;background:#0d1b2a;color:#fff;font-size:14px}

/* TABLE / LIST */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px;color:var(--text-dim);border-bottom:1px solid #334;font-size:11px;text-transform:uppercase}
.tbl td{padding:8px;border-bottom:1px solid #1a2540}
.tbl tr:hover{background:#ffffff08}

/* CHAT */
.chat-box{max-width:600px;margin:0 auto}
.chat-msg{margin-bottom:10px;padding:12px 16px;border-radius:12px;max-width:80%;font-size:14px;line-height:1.5}
.chat-msg.user{background:var(--primary);margin-left:auto}
.chat-msg.ai{background:var(--card)}
.chat-input{display:flex;gap:8px;position:sticky;bottom:0;padding-top:8px}
.chat-input input{flex:1;padding:12px;border:1px solid #334;border-radius:10px;background:#0d1b2a;color:#fff;font-size:14px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--dark2);border-radius:16px;padding:24px;width:420px;max-height:85vh;overflow-y:auto}
.modal h3{margin-bottom:16px;font-size:18px}
.modal-close{float:right;cursor:pointer;font-size:22px;color:var(--text-dim)}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark2);color:#fff;padding:12px 24px;border-radius:10px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.4);transition:.3s;opacity:0;pointer-events:none;border:1px solid #334}
#toast.show{opacity:1;bottom:40px}
#toast.error{border-color:var(--primary)}

.scroll{overflow-y:auto}
.tab-bar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{padding:6px 14px;border-radius:20px;background:var(--card);cursor:pointer;font-size:13px;white-space:nowrap}
.tab.active{background:var(--primary);color:#fff}
</style>
</head>
<body>
<div id="app">

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div style="font-size:48px;margin-bottom:8px">🍜</div>
    <h1>Indus Wok POS</h1>
    <p>The Flavours of Indus Wok</p>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="off">
    <div class="pin-display" id="pinDisplay">●●●●</div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="pinPress('1')">1</button>
      <button class="pin-btn" onclick="pinPress('2')">2</button>
      <button class="pin-btn" onclick="pinPress('3')">3</button>
      <button class="pin-btn" onclick="pinPress('4')">4</button>
      <button class="pin-btn" onclick="pinPress('5')">5</button>
      <button class="pin-btn" onclick="pinPress('6')">6</button>
      <button class="pin-btn" onclick="pinPress('7')">7</button>
      <button class="pin-btn" onclick="pinPress('8')">8</button>
      <button class="pin-btn" onclick="pinPress('9')">9</button>
      <button class="pin-btn" onclick="pinClear()" style="font-size:14px">CLR</button>
      <button class="pin-btn" onclick="pinPress('0')">0</button>
      <button class="pin-btn" onclick="doLogin()" style="background:var(--green)">✓</button>
    </div>
    <p style="margin-top:16px;font-size:11px;color:var(--text-dim)">Demo: Owner/1234 · Manager/1234</p>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">
  <div class="sidebar">
    <div class="logo">🍜</div>
    <button class="nav-btn active" data-view="dashboard" onclick="showView('dashboard')" title="Dashboard">📊</button>
    <button class="nav-btn" data-view="pos" onclick="showView('pos')" title="POS">🧾</button>
    <button class="nav-btn" data-view="tables" onclick="showView('tables')" title="Tables">🪑</button>
    <button class="nav-btn" data-view="kitchen" onclick="showView('kitchen')" title="Kitchen"><span id="kotBadge"></span>🍳</button>
    <button class="nav-btn" data-view="orders" onclick="showView('orders')" title="Orders">📦</button>
    <button class="nav-btn" data-view="sales" onclick="showView('sales')" title="Sales & Expenses">💰</button>
    <button class="nav-btn" data-view="inventory" onclick="showView('inventory')" title="Inventory">📦</button>
    <button class="nav-btn" data-view="staff" onclick="showView('staff')" title="Staff">👥</button>
    <button class="nav-btn" data-view="ai" onclick="showView('ai')" title="AI Assistant">🤖</button>
    <button class="nav-btn" data-view="settings" onclick="showView('settings')" title="Settings" style="margin-top:auto">⚙️</button>
  </div>
  <div class="content" id="content"></div>
</div>

</div>
<div id="toast"></div>
<div id="modalContainer"></div>

<script>
// ============================================================
// CONFIG - PASTE YOUR APPS SCRIPT WEB APP URL HERE
// ============================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEpsWSmDbvm5zhdg208n4kDrbUV_nXf5Np0mSqhN8cGxOkwbn0FmJHtwfB9XBHQLJ4/exec';

// ============================================================
// STATE
// ============================================================
let currentUser = null;
let pinBuffer = '';
let currentView = 'dashboard';
let menuItems = [];
let cart = [];
let currentCategory = 'all';
let tablesData = [];
let syncTimer = null;
let lastSyncTime = null;
let online = true;

// ============================================================
// API HELPER (GET-based, bypasses CORS completely)
// ============================================================
async function api(action, params={}) {
  if (SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbwEpsWSmDbvm5zhdg208n4kDrbUV_nXf5Np0mSqhN8cGxOkwbn0FmJHtwfB9XBHQLJ4/exec') {
    return { success:false, message:'Set SCRIPT_URL in index.html first!' };
  }
  const payload = JSON.stringify({
    action, params,
    username: currentUser ? currentUser.username : 'system',
    role: currentUser ? currentUser.role : 'Staff'
  });
  try {
    const url = SCRIPT_URL + '?payload=' + encodeURIComponent(payload);
    const res = await fetch(url);
    const data = await res.json();
    setOnline(true);
    return data;
  } catch(e) {
    setOnline(false);
    return { success:false, message:'Network error: ' + e.message };
  }
}

function setOnline(val) {
  online = val;
  const dot = document.querySelector('.sync-dot');
  if (dot) dot.className = 'sync-dot' + (val ? '' : ' off');
}

// ============================================================
// TOAST
// ============================================================
function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 3000);
}

// ============================================================
// LOGIN
// ============================================================
function pinPress(d) { if (pinBuffer.length < 4) { pinBuffer += d; updatePinDisplay(); } }
function pinClear() { pinBuffer = ''; updatePinDisplay(); }
function updatePinDisplay() {
  const d = document.getElementById('pinDisplay');
  d.textContent = pinBuffer.length > 0 ? '●'.repeat(pinBuffer.length) + '○'.repeat(4 - pinBuffer.length) : '●●●●';
}
document.addEventListener('keydown', e => {
  if (document.getElementById('loginScreen').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') pinPress(e.key);
  else if (e.key === 'Enter') doLogin();
  else if (e.key === 'Backspace') pinBuffer = pinBuffer.slice(0,-1), updatePinDisplay();
});

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  if (!username || !pinBuffer) { toast('Enter username and PIN', true); return; }
  toast('Logging in...');
  const res = await api('LOGIN', { username, pin: pinBuffer });
  if (res.success) {
    currentUser = res.user;
    pinBuffer = '';
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    await api('DAY_IN', { username: currentUser.username, name: currentUser.name, role: currentUser.role });
    startLiveSync();
    showView('dashboard');
    toast('Welcome ' + currentUser.name + '!');
  } else {
    toast(res.message || 'Login failed', true);
    pinClear();
  }
}

// ============================================================
// LIVE SYNC ENGINE
// ============================================================
function startLiveSync() {
  if (syncTimer) clearInterval(syncTimer);
  syncPoll(); // immediate
  syncTimer = setInterval(syncPoll, 5000); // every 5 seconds
}

async function syncPoll() {
  if (!currentUser) return;
  const res = await api('CHECK_SYNC');
  if (!res.success) return;
  lastSyncTime = new Date();

  // Update table statuses
  if (res.tableStatuses) tablesData = res.tableStatuses;
  if (currentView === 'tables') renderTables();
  if (currentView === 'dashboard') { /* could refresh */ }

  // Update kitchen KOTs
  if (currentView === 'kitchen' && res.newKOTs) renderKitchen(res.newKOTs);
  
  // Update KOT badge
  const newKots = (res.newKOTs || []).filter(k => k.status === 'New' || k.status === 'Cooking');
  const badge = document.getElementById('kotBadge');
  if (badge) badge.innerHTML = newKots.length > 0 ? '<span class="badge">'+newKots.length+'</span>' : '';

  // Update orders if on orders view
  if (currentView === 'orders' && res.newOrders) renderOrders(res.newOrders);
}

// ============================================================
// VIEW ROUTER
// ============================================================
function showView(view) {
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  const c = document.getElementById('content');
  switch(view) {
    case 'dashboard': renderDashboard(); break;
    case 'pos': renderPOS(); break;
    case 'tables': renderTables(); break;
    case 'kitchen': c.innerHTML = kitchenHTML(); loadKOTs(); break;
    case 'orders': c.innerHTML = ordersHTML(); loadOrders(); break;
    case 'sales': renderSales(); break;
    case 'inventory': renderInventory(); break;
    case 'staff': renderStaff(); break;
    case 'ai': renderAI(); break;
    case 'settings': renderSettings(); break;
  }
}

// ============================================================
// DASHBOARD
// ============================================================
async function renderDashboard() {
  const c = document.getElementById('content');
  c.innerHTML = `<div class="topbar"><h2>📊 Dashboard</h2><div class="sync-indicator"><span class="sync-dot"></span><span id="syncText">Synced</span></div></div><div id="dashContent"><p style="color:var(--text-dim)">Loading...</p></div>`;
  const res = await api('GET_DASHBOARD');
  if (!res.success) { document.getElementById('dashContent').innerHTML = '<p style="color:var(--primary)">'+res.message+'</p>'; return; }
  const d = res;
  const weekMax = Math.max(...d.weekData.map(w=>w.total), 1);
  let weekBars = d.weekData.map(w => `<div style="display:flex;align-items:end;gap:4px;flex:1;flex-direction:column"><div style="width:100%;background:linear-gradient(180deg,var(--primary),var(--primary-dark));border-radius:4px 4px 0 0;height:${Math.max(4, w.total/weekMax*120)}px;min-height:4px"></div><div style="font-size:9px;color:var(--text-dim);transform:rotate(-45deg)">${w.date.slice(5)}</div></div>`).join('');
  let lowStockHTML = d.lowStock.length === 0 ? '<p style="color:var(--green)">✅ All stock healthy</p>' :
    d.lowStock.map(s => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a2540"><span>${s.item}</span><span style="color:${s.status==='CRITICAL'?'var(--primary)':'var(--orange)'}">${s.stock}/${s.minLevel} ${s.unit} ${s.status==='CRITICAL'?'🚨':'⚠️'}</span></div>`).join('');
  document.getElementById('dashContent').innerHTML = `
    <div class="stat-grid">
      <div class="stat green"><div class="label">Today's Sales</div><div class="value">₹${fmt(d.todaySales)}</div></div>
      <div class="stat red"><div class="label">Expenses</div><div class="value">₹${fmt(d.todayExpenses)}</div></div>
      <div class="stat ${d.profit>=0?'green':'red'}"><div class="label">Profit</div><div class="value">₹${fmt(d.profit)}</div><div class="sub">${d.margin}% margin</div></div>
      <div class="stat blue"><div class="label">Orders</div><div class="value">${d.todayOrders}</div></div>
      <div class="stat orange"><div class="label">Cash</div><div class="value">₹${fmt(d.todayCash)}</div></div>
      <div class="stat blue"><div class="label">UPI</div><div class="value">₹${fmt(d.todayUPI)}</div></div>
      <div class="stat orange"><div class="label">Card</div><div class="value">₹${fmt(d.todayCard)}</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px">📈 Last 7 Days</h3>
      <div style="display:flex;height:140px;gap:4px;align-items:end">${weekBars}</div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:8px">📦 Low Stock Alerts</h3>
      ${lowStockHTML}
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-blue btn-sm" onclick="sendReport('daily')">📧 Daily Report</button>
      <button class="btn btn-outline btn-sm" onclick="sendReport('weekly')">📈 Weekly Report</button>
      <button class="btn btn-outline btn-sm" onclick="sendLowStockAlert()">🚨 Stock Alert</button>
    </div>`;
}

async function sendReport(type) {
  toast('Sending ' + type + ' report...');
  const action = type === 'daily' ? 'SEND_DAILY_REPORT' : 'SEND_WEEKLY_REPORT';
  const res = await api(action, {});
  toast(res.message || 'Sent!');
}

async function sendLowStockAlert() {
  toast('Checking stock...');
  const res = await api('SEND_LOW_STOCK_ALERT', {});
  toast(res.message);
}

// ============================================================
// POS
// ============================================================
async function renderPOS() {
  const c = document.getElementById('content');
  if (menuItems.length === 0) {
    c.innerHTML = '<p style="color:var(--text-dim)">Loading menu...</p>';
    const res = await api('GET_MENU_ITEMS');
    if (res.success) menuItems = res.menuItems;
  }
  const cats = ['all', ...new Set(menuItems.map(m=>m.category))];
  c.innerHTML = `
    <div class="topbar"><h2>🧾 POS — New Order</h2>
      <select id="orderType" onchange="onOrderTypeChange()" style="padding:8px;border-radius:8px;background:#0d1b2a;color:#fff;border:1px solid #334">
        <option value="Dine-in">Dine-in</option>
        <option value="Takeaway">Takeaway</option>

    <div class="pos-layout">
      <div>
        <div class="cat-bar" id="catBar">${cats.map(cat=>`<button class="cat-btn ${cat==='all'?'active':''}" onclick="setCategory('${cat}')">${cat}</button>`).join('')}</div>
        <div class="menu-grid" id="menuGrid"></div>
      </div>
      <div class="cart-panel">
        <div class="cart-header"><span style="font-weight:700">🛒 Cart (<span id="cartCount">0</span>)</span><button class="btn btn-outline btn-sm" onclick="clearCart()">Clear</button></div>
        <div class="cart-items" id="cartItems"><p style="color:var(--text-dim);text-align:center;padding:20px">Tap menu items to add</p></div>
        <div class="cart-footer">
          <div id="customerFields"></div>
          <div class="cart-total"><span>Total</span><span id="cartTotal">₹0</span></div>
          <div style="display:flex;gap:6px;margin-bottom:8px">
            <input type="number" id="discountInput" placeholder="Discount ₹" style="flex:1;padding:8px;border-radius:8px;background:#0d1b2a;color:#fff;border:1px solid #334" oninput="updateCartTotal()">
            <input type="number" id="taxInput" placeholder="Tax/GST ₹" style="flex:1;padding:8px;border-radius:8px;background:#0d1b2a;color:#fff;border:1px solid #334" oninput="updateCartTotal()">
          </div>
          <button class="btn btn-green" style="margin-bottom:6px" onclick="placeOrder()">✅ Place Order & Settle</button>
          <button class="btn btn-orange btn-primary" style="background:var(--orange)" onclick="printKOT()">🖨️ Print KOT</button>
        </div>

function onOrderTypeChange() {
  const ot = document.getElementById('orderType').value;
  const ts = document.getElementById('tableSelect');
  const cf = document.getElementById('customerFields');
  if (ot === 'Dine-in') {
    let opts = tablesData.map(t=>`<option value="${t.tableNo}">${t.tableNo} (${t.status})</option>`).join('');
    ts.innerHTML = `<div class="form-row" style="margin-bottom:8px"><div><label>Table</label><select id="selTable" style="padding:10px">${opts}</select></div></div>`;
    cf.innerHTML = '';
  } else {
    ts.innerHTML = '';
    cf.innerHTML = `<div class="form-row" style="margin-bottom:8px">
      <div><label>Customer Name</label><input type="text" id="custName" placeholder="Name"></div>
      <div><label>Phone</label><input type="text" id="custPhone" placeholder="Phone"></div>
      </div>${ot==='Delivery'||ot==='Zomato'||ot==='Swiggy'?'<div class="form-row" style="margin-bottom:8px"><div><label>Address</label><input type="text" id="custAddr" placeholder="Delivery address"></div></div>':''}`;
  }
}

function setCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.textContent === cat));
  const items = cat === 'all' ? menuItems : menuItems.filter(m=>m.category===cat);
  document.getElementById('menuGrid').innerHTML = items.map(m => `
    <div class="menu-item" onclick="addToCart('${esc(m.itemName)}', ${m.fullPrice}, ${m.halfPrice||0})">
      <div class="name">${m.itemName}</div>
      <div class="price">₹${m.fullPrice}</div>
      ${m.halfPrice > 0 ? '<div class="half">Half ₹'+m.halfPrice+'</div>' : ''}
    </div>`).join('') || '<p style="color:var(--text-dim)">No items</p>';
}

function addToCart(name, fullPrice, halfPrice) {
  let size = 'FULL';
  if (halfPrice > 0) {
    size = confirm('OK = Full (₹'+fullPrice+')\nCancel = Half (₹'+halfPrice+')') ? 'FULL' : 'HALF';
  }
  const price = size === 'HALF' ? halfPrice : fullPrice;
  const existing = cart.find(c => c.name === name && c.size === size);
  if (existing) existing.qty++;
  else cart.push({ name, price, size, qty: 1 });
  renderCart();
}

function renderCart() {
  const el = document.getElementById('cartItems');
  if (!el) return;
  if (cart.length === 0) { el.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:20px">Tap menu items to add</p>'; }
  else {
    el.innerHTML = cart.map((c,i) => `
      <div class="cart-row">
        <div class="ci-name">${c.name}${c.size==='HALF'?' <span style="color:var(--orange)">(H)</span>':''}<br><span style="color:var(--text-dim);font-size:11px">₹${c.price} × ${c.qty}</span></div>
        <div class="ci-qty">
          <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
          <span style="min-width:20px;text-align:center">${c.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
        </div>
        <div style="width:60px;text-align:right;font-weight:700">₹${c.price*c.qty}</div>
      </div>`).join('');
  }
  document.getElementById('cartCount').textContent = cart.reduce((a,c)=>a+c.qty,0);
  updateCartTotal();
}

function changeQty(i, delta) {
  cart[i].qty += delta;
  if (cart[i].qty <= 0) cart.splice(i,1);
  renderCart();
}

function updateCartTotal() {
  const sub = cart.reduce((a,c)=>a+c.price*c.qty,0);
  const disc = Number(document.getElementById('discountInput')?.value||0);
  const tax = Number(document.getElementById('taxInput')?.value||0);
  const total = sub - disc + tax;
  const el = document.getElementById('cartTotal');
  if (el) el.textContent = '₹' + total;
  return total;
}

function clearCart() { cart = []; renderCart(); }

async function placeOrder() {
  if (cart.length === 0) { toast('Cart is empty!', true); return; }
  const orderType = document.getElementById('orderType').value;
  const tableNo = document.getElementById('selTable')?.value || '';
  const sub = cart.reduce((a,c)=>a+c.price*c.qty,0);
  const discount = Number(document.getElementById('discountInput')?.value||0);
  const tax = Number(document.getElementById('taxInput')?.value||0);
  const total = sub - discount + tax;

  const params = {
    tableNo, items: cart, total, tax, discount,
    paymentMode: 'Cash', cashAmt: total, upiAmt: 0, cardAmt: 0,
    status: 'Completed', orderType,
    customerName: document.getElementById('custName')?.value || '',
    customerPhone: document.getElementById('custPhone')?.value || '',
    deliveryAddress: document.getElementById('custAddr')?.value || ''
  };
  toast('Placing order...');
  const res = await api('PLACE_ORDER', params);
  if (res.success) {
    // Also log sale
    await api('ADD_SALE', { totalSales: total, cash: params.cashAmt, upi: 0, card: 0, ordersCount: 1, notes: res.orderId, date: todayStr() });
    toast('Order ' + res.orderId + ' placed!');
    clearCart();
    tablesData = tablesData.map(t => t.tableNo === tableNo ? {...t, status:'Occupied'} : t);
  } else {
    toast(res.message || 'Failed', true);
  }
}

async function printKOT() {
  if (cart.length === 0) { toast('Cart is empty!', true); return; }
  const orderType = document.getElementById('orderType').value;
  const tableNo = document.getElementById('selTable')?.value || '';
  toast('Printing KOT...');
  const res = await api('PRINT_KOT', { items: cart, tableNo, station: 'Main', orderId: '' });
  if (res.success) {
    toast('KOT ' + res.kotId + ' sent to kitchen!');
    // Also place the order so it's tracked
    await api('PLACE_ORDER', {
      tableNo, items: cart,
      total: cart.reduce((a,c)=>a+c.price*c.qty,0), tax:0, discount:0,
      paymentMode:'Pending', cashAmt:0, upiAmt:0, cardAmt:0,
      status:'Pending', orderType,
      customerName: document.getElementById('custName')?.value||'',
      customerPhone: document.getElementById('custPhone')?.value||'',
      deliveryAddress: document.getElementById('custAddr')?.value||''
    });
  } else toast(res.message||'Failed', true);
}

async function renderTables() {
  const c = document.getElementById('content');
  if (tablesData.length === 0) {
    c.innerHTML = '<p style="color:var(--text-dim)">Loading tables...</p>';
    const res = await api('GET_TABLES');
    if (res.success) tablesData = res.tables;
  }
  c.innerHTML = `<div class="topbar"><h2>🪑 Tables</h2><div class="sync-indicator"><span class="sync-dot"></span>Live</div></div>`;
  const floors = {};
  tablesData.forEach(t => { if (!floors[t.area]) floors[t.area] = []; floors[t.area].push(t); });
  let html = '';
  for (const area in floors) {
    html += `<div class="floor"><h3>${area}</h3><div class="table-grid">`;
    html += floors[area].map(t => `
      <div class="table-box ${t.status.toLowerCase()}" onclick="tableAction('${t.tableNo}','${t.status}')">
        <div class="tn">${t.tableNo}</div>
        <div class="ts">${t.status}</div>
      </div>`).join('');
    html += '</div></div>';
  }
  c.innerHTML += html;
}

function tableAction(tableNo, status) {
  if (status === 'Available') {
    showView('pos');
    setTimeout(() => {
      const sel = document.getElementById('selTable');
      if (sel) sel.value = tableNo;
    }, 500);
  } else {
    if (confirm('Mark ' + tableNo + ' as Available?')) {
      api('UPDATE_TABLE', { tableNo, status:'Available' }).then(res => {
        tablesData = tablesData.map(t => t.tableNo === tableNo ? {...t, status:'Available'} : t);
        renderTables();
        toast(tableNo + ' marked available');
      });
    }
  }
}

async function loadStaffList() {
  document.getElementById('staffContent').innerHTML = '<p style="color:var(--text-dim)">Loading...</p>';
  const res = await api('GET_STAFF');
  if (!res.success) return;
  document.getElementById('staffContent').innerHTML = '<table class="tbl"><tr><th>Name</th><th>Role</th><th>Phone</th><th>Salary</th></tr>' +
    res.staff.map(s => `<tr><td>${s.name}</td><td>${s.role}</td><td>${s.phone||'-'}</td><td>₹${s.salary}</td></tr>`).join('') + '</table>';
}

async function loadAttendance() {
  document.getElementById('staffContent').innerHTML = '<p style="color:var(--text-dim)">Loading...</p>';
  const [staffRes, attRes] = await Promise.all([api('GET_STAFF'), api('GET_ATTENDANCE')]);
  let html = '<div class="card"><h3 style="margin-bottom:8px">Check In / Out</h3><div style="display:flex;gap:8px;flex-wrap:wrap">';
  if (staffRes.success) staffRes.staff.forEach(s => {
    html += `<button class="btn btn-outline btn-sm" onclick="checkInStaff('${esc(s.name)}')">📥 ${s.name} In</button>`;
    html += `<button class="btn btn-outline btn-sm" onclick="checkOutStaff('${esc(s.name)}')">📤 ${s.name} Out</button>`;
  });
  html += '</div></div>';
  if (attRes.success) {
    html += '<div class="card"><table class="tbl"><tr><th>Date</th><th>Name</th><th>In</th><th>Out</th><th>Hrs</th></tr>';
    attRes.attendance.slice(-10).reverse().forEach(a => { html += `<tr><td>${a.date}</td><td>${a.staffName}</td><td>${a.checkIn||''}</td><td>${a.checkOut||''}</td><td>${a.hours||''}</td></tr>`; });
    html += '</table></div>';
  }
  document.getElementById('staffContent').innerHTML = html;
}

async function checkInStaff(name) { const r = await api('CHECK_IN', { staffName:name }); toast(r.success ? name+' checked in at '+r.checkInTime : r.message, !r.success); loadAttendance(); }
async function checkOutStaff(name) { const r = await api('CHECK_OUT', { staffName:name }); toast(r.success ? name+' checked out' : r.message, !r.success); loadAttendance(); }
async function addStaff() {
  const r = await api('ADD_STAFF', {
    name: document.getElementById('stName').value, phone: document.getElementById('stPhone').value,
    role: document.getElementById('stRole').value, salary: Number(document.getElementById('stSalary').value)||0,
    address: document.getElementById('stAddr').value
  });
  toast(r.success ? 'Staff added!' : r.message, !r.success);
}

function renderAI() {
  const c = document.getElementById('content');
  c.innerHTML = `<div class="topbar"><h2>🤖 AI Assistant</h2><button class="btn btn-blue btn-sm" onclick="getPredictions()">📊 Predictions</button></div>
    <div class="chat-box">
      <div id="chatMessages" style="margin-bottom:80px">
        <div class="chat-msg ai">👋 Hi! I'm Indus Wok AI. Ask me about sales, stock, profit, or get predictions!</div>
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn btn-primary" onclick="sendChat()">Send</button>
      </div>
    </div>`;
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  document.getElementById('chatMessages').innerHTML += `<div class="chat-msg user">${msg}</div>`;
  document.getElementById('chatMessages').innerHTML += `<div class="chat-msg ai" id="thinking">🤔 Thinking...</div>`;
  scrollChat();
  const res = await api('AI_CHAT', { message: msg });
  document.getElementById('thinking').remove();
  document.getElementById('chatMessages').innerHTML += `<div class="chat-msg ai">${res.answer || res.message || 'Sorry, I could not process that.'}</div>`;
  scrollChat();
}

async function getPredictions() {
  document.getElementById('chatMessages').innerHTML += `<div class="chat-msg ai" id="thinking">📊 Analyzing sales data...</div>`;
  scrollChat();
  const res = await api('GET_PREDICTIONS');
  document.getElementById('thinking').remove();
  if (res.success) {
    const p = res.prediction;
    document.getElementById('chatMessages').innerHTML += `<div class="chat-msg ai">
      📈 <strong>Sales Prediction</strong><br>
      Average Daily: ₹${p.averageDaily}<br>
      Predicted Today: ₹${p.predictedToday} (${p.todayDay})<br>
      Best Day: ₹${p.maxDaily} | Worst: ₹${p.minDaily}<br><br>
      ${p.geminiInsight}
    </div>`;
  }
  scrollChat();
}

function scrollChat() { const el = document.getElementById('chatMessages'); el.scrollTop = el.scrollHeight; }

async function renderSettings() {
  const c = document.getElementById('content');
  c.innerHTML = `<div class="topbar"><h2>⚙️ Settings</h2></div>
    <div class="card">
      <p style="margin-bottom:8px"><strong>Logged in:</strong> ${currentUser.name} (${currentUser.role})</p>
      <p style="margin-bottom:8px"><strong>Sync Status:</strong> <span style="color:${online?'var(--green)':'var(--orange)'}">${online?'● Online':'● Offline'}</span></p>
      <p style="margin-bottom:8px"><strong>API URL:</strong> ${SCRIPT_URL === 'PASTE_YOUR_WEB_APP_URL_HERE' ? '<span style="color:var(--primary)">NOT SET</span>' : '✅ Configured'}</p>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px">👤 User Management</h3>
      <button class="btn btn-primary btn-sm" onclick="showAddUser()">+ Add User</button>
      <div id="userList" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:8px">📤 Logout</h3>
      <button class="btn btn-outline" onclick="logout()">Day Out & Logout</button>
    </div>`;
  const res = await api('GET_USERS');
  if (res.success) {
    document.getElementById('userList').innerHTML = '<table class="tbl"><tr><th>Username</th><th>Name</th><th>Role</th></tr>' +
      res.users.map(u => `<tr><td>${u.username}</td><td>${u.name}</td><td>${u.role}</td></tr>`).join('') + '</table>';
  }
}

function showAddUser() {
  showModal('Add User', `<div class="form-row"><div><label>Username</label><input type="text" id="newUsername"></div><div><label>Name</label><input type="text" id="newName"></div></div>
    <div class="form-row"><div><label>PIN (4 digits)</label><input type="text" id="newPin" maxlength="4"></div><div><label>Role</label><select id="newRole"><option>Staff</option><option>Captain</option><option>Manager</option><option>Owner</option></select></div></div>
    <button class="btn btn-primary" onclick="addUser()">Create User</button>`);
}

async function addUser() {
  const res = await api('ADD_USER', {
    username: document.getElementById('newUsername').value,
    name: document.getElementById('newName').value,
    pin: document.getElementById('newPin').value,
    role: document.getElementById('newRole').value
  });
  toast(res.success ? 'User created!' : res.message, !res.success);
  if (res.success) { closeModal(); renderSettings(); }
}

function logout() {
  if (currentUser) api('DAY_OUT', { username: currentUser.username });
  if (syncTimer) clearInterval(syncTimer);
  currentUser = null;
  cart = [];
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  pinClear();
  document.getElementById('loginUser').value = '';
}

function showModal(title, body) {
  document.getElementById('modalContainer').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><span class="modal-close" onclick="closeModal()">×</span><h3>${title}</h3>${body}</div></div>`;
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

function fmt(n) { return Number(n||0).toLocaleString('en-IN'); }
function esc(s) { return String(s||'').replace(/'/g, "\\'"); }
function todayStr() { return new Date().toISOString().slice(0,10); }
